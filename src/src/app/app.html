@if (ready()) {
  <div class="app" role="application" aria-label="Notes Kanban">
    <header class="header" aria-label="Header">
      <div class="headerRow">
        <div class="headerTitle">Vim To-Do List</div>
        <div class="headerLinks" aria-label="Header links">
          <select
            id="themeSelect"
            class="headerThemeSelect"
            [ngModel]="themeModel()"
            (ngModelChange)="onThemeChange($event)"
            aria-label="Theme"
          >
            @for (theme of themeOptions; track theme) {
              <option [value]="theme">{{ theme }}</option>
            }
          </select>
          <a id="instructionsLink" routerLink="/instructions" class="headerLink" routerLinkActive="headerLink--active">Instructions</a>
          <a id="aboutLink" routerLink="/about" class="headerLink" routerLinkActive="headerLink--active">About</a>
          <a id="settingsBtn" routerLink="/settings" class="headerIconButton" aria-label="Settings" title="Settings">
            <svg class="headerIconButtonSvg" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </a>
          <button id="closePopupBtn" type="button" class="headerLink monoLinkButton" (click)="closePopup()">Close</button>
        </div>
      </div>
    </header>

    @if (showViewNav()) {
      <nav class="viewNav" aria-label="Primary views">
        <a
          routerLink="/"
          routerLinkActive="viewNav__link--active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="viewNav__link monoLinkButton"
        >
          Notes
        </a>
        <a routerLink="/dashboard" routerLinkActive="viewNav__link--active" class="viewNav__link monoLinkButton">
          Dashboard
        </a>
        <a routerLink="/calendar" routerLinkActive="viewNav__link--active" class="viewNav__link monoLinkButton">
          Calendar
        </a>
      </nav>
    }

    <div class="body">
      <router-outlet />
    </div>
  </div>
} @else {
  <div class="loading">Loading…</div>
}
